<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel - Gift Campaign</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .logout {
      background: #d93025;
      max-width: 150px;
      float: right;
    }

    .hidden {
      display: none !important;
    }

    .loginBox {
      max-width: 420px;
      margin: 80px auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .stat {
      background: #f1f3f4;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 5px;
    }

    .search {
      margin-bottom: 15px;
    }

    .tableWrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 12px 10px;
      text-align: left;
    }

    th {
      background: #f1f3f4;
    }

    .code {
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 600px) {

      .container {
        margin: 10px auto;
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .logout {
        float: none;
        max-width: 100%;
      }

    }

  </style>

</head>


<body>


<!-- ================================
     LOGIN
================================ -->

<section id="loginSection">

  <div class="loginBox">

    <div class="card">

      <h1>🔐 Admin Login</h1>

      <p>
        Enter the administrator password.
      </p>

      <form id="loginForm">

        <input
          type="password"
          id="password"
          placeholder="Admin password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

  </div>

</section>


<!-- ================================
     ADMIN PANEL
================================ -->

<section
  id="adminSection"
  class="hidden"
>

  <div class="container">

    <div class="card">

      <button
        type="button"
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

      <h1>
        🎁 Gift Campaign Admin
      </h1>

      <div style="clear: both;"></div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          Total Entries

          <strong id="totalEntries">
            0
          </strong>

        </div>


        <div class="stat">

          Coupon Submitted

          <strong id="secretEntries">
            0
          </strong>

        </div>

      </div>


      <!-- SEARCH -->

      <input
        type="text"
        id="search"
        class="search"
        placeholder="Search ID, name, email, mobile, district or coupon..."
        oninput="filterTable()"
      >


      <!-- TABLE -->

      <div class="tableWrap">

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>Name</th>

              <th>Email</th>

              <th>Mobile</th>

              <th>DOB</th>

              <th>District</th>

              <th>Coupon Code</th>

              <th>Status</th>

              <th>Created</th>

            </tr>

          </thead>


          <tbody id="tableBody">

            <tr>

              <td
                colspan="9"
                style="text-align:center;"
              >
                Loading...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</section>


<script>

// ====================================
// VARIABLES
// ====================================

let adminPassword = "";

let allParticipants = [];


// ====================================
// LOGIN
// ====================================

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const password =
        document
          .getElementById("password")
          .value;

      if (!password) {

        alert(
          "Please enter password."
        );

        return;

      }


      const status =
        document
          .getElementById("loginStatus");

      status.textContent =
        "Checking password...";


      try {

        const response =
          await fetch(
            "/api/admin/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                password: password
              })

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          status.textContent = "";

          alert(
            data.message ||
            "Wrong password."
          );

          return;

        }


        adminPassword =
          password;


        document
          .getElementById(
            "loginSection"
          )
          .classList.add(
            "hidden"
          );


        document
          .getElementById(
            "adminSection"
          )
          .classList.remove(
            "hidden"
          );


        status.textContent = "";


        await loadAdminData();

      }

      catch (error) {

        console.error(
          "Login error:",
          error
        );

        status.textContent = "";

        alert(
          "Could not connect to server."
        );

      }

    }
  );


// ====================================
// LOAD ADMIN DATA
// ====================================

async function loadAdminData() {

  try {

    const response =
      await fetch(
        "/api/admin/data",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            password:
              adminPassword
          })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      alert(
        data.message ||
        "Could not load data."
      );

      return;

    }


    allParticipants =
      data.participants || [];


    document
      .getElementById(
        "totalEntries"
      )
      .textContent =
        allParticipants.length;


    const secretCount =
      allParticipants.filter(
        function(p) {

          return (
            p.secret_code !== null &&
            p.secret_code !== undefined &&
            p.secret_code !== ""
          );

        }
      ).length;


    document
      .getElementById(
        "secretEntries"
      )
      .textContent =
        secretCount;


    displayTable(
      allParticipants
    );

  }

  catch (error) {

    console.error(
      "Admin data error:",
      error
    );

    alert(
      "Could not connect to server."
    );

  }

}


// ====================================
// DISPLAY TABLE
// ====================================

function displayTable(participants) {

  const body =
    document.getElementById(
      "tableBody"
    );


  body.innerHTML = "";


  if (
    participants.length === 0
  ) {

    body.innerHTML = `

      <tr>

        <td
          colspan="9"
          style="text-align:center;"
        >

          No entries found.

        </td>

      </tr>

    `;

    return;

  }


  participants.forEach(
    function(p) {

      const row =
        document.createElement("tr");


      const created =
        p.created_at
          ? new Date(
              p.created_at
            ).toLocaleString()
          : "-";


      const secretStatus =
        p.secret_code
          ? "✅ Submitted"
          : "❌ Not submitted";


      row.innerHTML = `

        <td>
          ${escapeHTML(p.id)}
        </td>


        <td>
          ${escapeHTML(p.name)}
        </td>


        <td>
          ${escapeHTML(p.email || "-")}
        </td>


        <td>
          ${escapeHTML(p.mobile)}
        </td>


        <td>
          ${escapeHTML(p.dob)}
        </td>


        <td>
          ${escapeHTML(p.district)}
        </td>


        <td class="code">
          ${escapeHTML(
            p.secret_code || "-"
          )}
        </td>


        <td>
          ${secretStatus}
        </td>


        <td>
          ${escapeHTML(created)}
        </td>

      `;


      body.appendChild(row);

    }
  );

}


// ====================================
// SEARCH
// ====================================

function filterTable() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    displayTable(
      allParticipants
    );

    return;

  }


  const filtered =
    allParticipants.filter(
      function(p) {

        return (

          String(p.id)
            .toLowerCase()
            .includes(search)

          ||

          String(p.name || "")
            .toLowerCase()
            .includes(search)

          ||

          String(p.email || "")
            .toLowerCase()
            .includes(search)

          ||

          String(p.mobile || "")
            .toLowerCase()
            .includes(search)

          ||

          String(p.district || "")
            .toLowerCase()
            .includes(search)

          ||

          String(p.secret_code || "")
            .toLowerCase()
            .includes(search)

        );

      }
    );


  displayTable(
    filtered
  );

}


// ====================================
// LOGOUT
// ====================================

function logout() {

  adminPassword = "";

  allParticipants = [];


  document
    .getElementById(
      "adminSection"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "loginSection"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "password"
    )
    .value = "";


  document
    .getElementById(
      "loginStatus"
    )
    .textContent = "";

}


// ====================================
// SECURITY
// ====================================

function escapeHTML(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}

</script>


</body>

                </html>
